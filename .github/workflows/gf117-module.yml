name: GF117 Nouveau module
on:
  workflow_dispatch:
  push:
    branches: ['main']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 45
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed git pahole python kmod curl zstd ripgrep
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Clang LLVM and LLD 23.1.1
        shell: bash
        run: bash ci/install-toolchain.sh
      - name: Build exact CachyOS module and check source harnesses
        shell: bash
        run: bash ci/build-gf117-module.sh
      - name: Upload module, manifest and complete log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gf117-nouveau-${{ github.sha }}
          path: ci-output/
          retention-days: 7
          compression-level: 0
